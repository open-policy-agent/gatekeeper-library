apiVersion: v1
kind: Pod
metadata:
  name: kustomize-disallowed
spec:
  initContainers:
  - name: kustomize
    image:  k8s.gcr.io/kustomize/kustomize:v3.8.9
    securityContext:
      allowPrivilegeEscalation: false
  containers:
    - name: kustomize
      image: k8s.gcr.io/kustomize/kustomize:v3.8.9
      securityContext:
        allowPrivilegeEscalation: false
  ephemeralContainers:
    - name: kustomize
      image: k8s.gcr.io/kustomize/kustomize:v3.8.9
      securityContext:
        allowPrivilegeEscalation: false
