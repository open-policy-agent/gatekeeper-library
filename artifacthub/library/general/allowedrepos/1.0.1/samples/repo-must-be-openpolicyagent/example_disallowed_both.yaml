apiVersion: v1
kind: Pod
metadata:
  name: nginx-disallowed
spec:
  initContainers:
  - name: nginxinit
    image: nginx
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      limits:
        cpu: "100m"
        memory: "30Mi"
  containers:
    - name: nginx
      image: nginx
      securityContext:
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: "100m"
          memory: "30Mi"
