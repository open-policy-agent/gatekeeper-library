apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-with-all-node-affinity-terms
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                  - "true"
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: In
                values:
                  - "true"
              - key: kubernetes.io/os
                operator: In
                values:
                  - linux
  containers:
    - name: training
      image: nvidia/cuda:12.0-runtime
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "1"
