apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-with-node-affinity-key-does-not-exist
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: DoesNotExist
  containers:
    - name: training
      image: nvidia/cuda:12.0-runtime
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "1"
          memory: 1Gi
          nvidia.com/gpu: "1"
